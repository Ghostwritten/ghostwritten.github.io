<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* 自定义样式 */
        .section {
            padding: 60px 0;
        }
        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }
        .icon-box {
            text-align: center;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            transition: transform 0.3s;
        }
        .icon-box:hover {
            transform: scale(1.05);
        }
        .icon-box img {
            max-width: 100px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- 博客介绍 -->
    <section class="section bg-light">
        <div class="container">
            <h2 class="section-title">欢迎来到我的博客</h2>
            <p class="text-center">这是一个分享技术、生活和生产力工具的地方。希望你能在这里找到有用的内容！</p>
        </div>
    </section>

    <!-- 运维领域 -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">运维领域</h2>
            <div class="row">
                <div class="col-md-3">
                    <a href="/linux" class="icon-box">
                        <img src="images/linux.png" alt="Linux">
                        <h4>Linux</h4>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/kubernetes" class="icon-box">
                        <img src="images/kubernetes.png" alt="Kubernetes">
                        <h4>Kubernetes</h4>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/ci-cd" class="icon-box">
                        <img src="images/ci-cd.png" alt="CI/CD">
                        <h4>CI/CD</h4>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/ansible" class="icon-box">
                        <img src="images/ansible.png" alt="Ansible">
                        <h4>Ansible</h4>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- 开发领域 -->
    <section class="section bg-light">
        <div class="container">
            <h2 class="section-title">开发领域</h2>
            <div class="row">
                <div class="col-md-4">
                    <a href="/go" class="icon-box">
                        <img src="images/go.png" alt="Go">
                        <h4>Go</h4>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/python" class="icon-box">
                        <img src="images/python.png" alt="Python">
                        <h4>Python</h4>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/shell" class="icon-box">
                        <img src="images/shell.png" alt="Shell">
                        <h4>Shell</h4>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- 生产力工具 -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">生产力工具</h2>
            <p class="text-center">分享一些提升效率的工具和技巧，让你的工作和生活更加高效。</p>
        </div>
    </section>

    <!-- 个人生活 -->
    <section class="section bg-light">
        <div class="container">
            <h2 class="section-title">个人生活</h2>
            <div class="row">
                <div class="col-md-3">
                    <a href="/books" class="icon-box">
                        <img src="images/books.png" alt="看书">
                        <h4>看书</h4>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/travel" class="icon-box">
                        <img src="images/travel.png" alt="旅行">
                        <h4>旅行</h4>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/movies" class="icon-box">
                        <img src="images/movies.png" alt="电影">
                        <h4>电影</h4>
                    </a>
                </div>
                <div class="col-md-3">
                    <a href="/cooking" class="icon-box">
                        <img src="images/cooking.png" alt="做饭">
                        <h4>做饭</h4>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
